<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reseña - Rapunzel</title>
<style>
    body {
        background: linear-gradient(135deg, #ffd700 0%, #b19cd9 50%, #4b0082 100%);
        background-attachment: fixed;
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Comic Sans MS', cursive;
    }
    .contenedor-dual {
        background: rgba(255, 255, 255, 0.9);
        display: flex; flex-direction: row; align-items: center; padding: 40px; border-radius: 50px; border: 4px solid #fff; box-shadow: 0 0 30px rgba(75, 0, 130, 0.2); max-width: 1000px; width: 95%;
    }
    .parte-texto { flex: 1.2; padding-right: 30px; text-align: center; }
    .parte-foto { flex: 0.8; display: flex; justify-content: center; }
    .parte-foto img { max-width: 100%; height: auto; border-radius: 30px; border: 3px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    h1 { color: #6a5acd; font-size: 2.8em; } 
    .estrellas { font-size: 2em; color: #ffd700; margin-bottom: 20px; text-shadow: 1px 1px #4b0082; }
    .comentario { color: #444; font-size: 1.1em; background: #fff; padding: 25px; border-radius: 30px; border: 2px dashed #ffd700; text-align: justify; }
    .btn-volver { display: inline-block; margin-top: 25px; background: #6a5acd; color: white; text-decoration: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; }
</style>
</head>
<body>
    <div class="contenedor-dual">
      <div class="parte-texto">
            <h1>Enredados</h1>
            <div class="estrellas">★★★★★</div>
        <div class="comentario">
                Una de las mejores versiones de princesas. La aventura de Rapunzel y Flynn es mágica, divertida y con canciones que se quedan grabadas. Ver las linternas flotantes siempre será un momento especial que me recuerda a mi infancia.
          </div>
          <a href="index.html" class="btn-volver">Volver al menú</a>
        </div>
        <div class="parte-foto">
            <img src="rapunzel.jpg" alt="Rapunzel">
        </div>
    </div>
</body>
</html>

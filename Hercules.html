<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reseña - Hércules</title>
<style>
    body {
        background: linear-gradient(135deg, #ff8c00 0%, #1e90ff 50%, #ffffff 100%);
        background-attachment: fixed;
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Comic Sans MS', cursive;
    }
    .contenedor-dual {
        background: rgba(255, 255, 255, 0.9);
        display: flex; flex-direction: row; align-items: center; padding: 40px; border-radius: 40px; border: 5px solid #ff8c00; box-shadow: 0 0 30px rgba(0,0,0,0.1); max-width: 1000px; width: 95%;
    }
    .parte-texto { flex: 1.2; padding-right: 30px; text-align: center; }
    .parte-foto { flex: 0.8; display: flex; justify-content: center; }
    .parte-foto img { max-width: 100%; height: auto; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    h1 { color: #ff4500; font-size: 2.8em; text-transform: uppercase; } 
    .estrellas { font-size: 2em; color: #ffd700; margin-bottom: 20px; }
    .comentario { color: #333; font-size: 1.1em; background: #fffaf0; padding: 25px; border-radius: 20px; border: 2px solid #1e90ff; text-align: justify; }
    .btn-volver { display: inline-block; margin-top: 25px; background: #1e90ff; color: white; text-decoration: none; padding: 12px 30px; border-radius: 10px; font-weight: bold; }
</style>
</head>
<body>
    <div class="contenedor-dual">
      <div class="parte-texto">
            <h1>Hércules</h1>
            <div class="estrellas">★★★★★</div>
        <div class="comentario">
             Esta película tiene el mejor soundtrack de Disney. Herc es una de mis personajes favoritos por su actitud, y la historia de superación de Hércules mezclada con la mitología griega es simplemente genial.
          </div>
          <a href="index.html" class="btn-volver">Volver al menú</a>
        </div>
        <div class="parte-foto">
            <img src="hercules.jpg" alt="Hercules">
        </div>
    </div>
</body>
</html>

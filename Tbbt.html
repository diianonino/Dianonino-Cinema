<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reseña - The Big Bang Theory</title>
<style>
    body {
        background: linear-gradient(135deg, #1e90ff 0%, #ff4500 50%, #ffd700 100%);
        background-attachment: fixed;
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Comic Sans MS', cursive;
    }
    .contenedor-dual {
        background: rgba(255, 255, 255, 0.9);
        display: flex; flex-direction: row; align-items: center; padding: 40px; border-radius: 40px; border: 4px solid #fff; box-shadow: 0 0 30px rgba(30, 144, 255, 0.3); max-width: 1000px; width: 95%;
    }
    .parte-texto { flex: 1.2; padding-right: 30px; text-align: center; }
    .parte-foto { flex: 0.8; display: flex; justify-content: center; }
    .parte-foto img { max-width: 100%; height: auto; border-radius: 20px; border: 3px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    h1 { color: #1e90ff; font-size: 2.8em; text-shadow: 2px 2px #fff; }
    .estrellas { font-size: 2em; color: #ff4500; margin-bottom: 20px; }
    .comentario { color: #444; font-size: 1.1em; line-height: 1.6; background: #fff; padding: 25px; border-radius: 30px; border: 2px dashed #ff4500; text-align: justify; }
    .btn-volver { display: inline-block; margin-top: 25px; background: #1e90ff; color: white; text-decoration: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; transition: 0.3s; }
</style>
</head>
<body>
    <div class="contenedor-dual">
        <div class="parte-texto">
            <h1>The Big Bang Theory</h1>
            <div class="estrellas">★★★★★</div>
            <div class="comentario">
                Una comedia que celebra la cultura geek y la amistad. Con un grupo de científicos brillantes pero socialmente torpes y su vecina Penny, la serie esta llena de referencias nerds y burla a la misma cultura geek, personalmente me veo en Sheldon y lo adoro.
            </div>
            <a href="index.html" class="btn-volver">Volver al menú</a>
        </div>
        <div class="parte-foto">
            <img src="tbbt.jpg" alt="Poster The Big Bang Theory">
        </div>
    </div>
</body>
</html>
